<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cabecera Imputaciones</title>

<link rel="stylesheet" href="/web-files/bootstrap.min.css" />
<link rel="stylesheet" href="/web-files/portalbasictheme.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
<style>
  .toastify.cab20-toast {
    max-width: min(320px, calc(100vw - 24px));
    width: auto;
    box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
  }

  .cab20-confirm-dialog {
    display: flex;
    justify-content: center;
    max-width: none;
    width: 100%;
    margin: var(--bs-modal-margin, 1.75rem) auto;
  }

  .cab20-confirm-card {
    display: flex;
    flex-direction: column;
    width: fit-content;
    min-width: min(40rem, calc(100vw - 24px));
    max-width: min(58rem, calc(100vw - 24px));
  }

  .cab20-confirm-head {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 0.85rem 1.25rem;
  }

  .cab20-confirm-icon {
    width: 2.25rem;
    height: 2.25rem;
    flex-shrink: 0;
  }

  .cab20-confirm-text {
    white-space: nowrap;
    text-align: left;
  }

  @media (max-width: 576px) {
    .cab20-confirm-card {
      width: calc(100vw - 24px);
      min-width: 0;
      max-width: calc(100vw - 24px);
    }

    .cab20-confirm-text {
      white-space: normal;
    }
  }
</style>


<main class="container pt-2 pb-4 cab20-pagee">
  <!-- HEADER / BANNER -->
  <section class="bg-white border-bottom shadow-sm mb-3 cab20-header cab20-page-banner">
    <div class="px-3 py-2">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div>
          <h1 class="fs-4 text-dark mb-1 fw-bold">Cabecera de Imputaciones</h1>
          <p class="small text-dark mb-0">Gestión de registros semanales</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ACTION BAR -->
  <section class="bg-white p-3 rounded shadow-sm border d-flex flex-wrap gap-3 align-items-end mb-3 cab20-card">
    <!-- BUSCADOR -->
    <div class="flex-grow-1 position-relative" style="min-width: 280px;">
      <label class="d-block small fw-bold green-text text-uppercase mb-2">Buscar registros</label>
      <div class="position-relative">
        <input type="text" id="searchInput" class="form-control bg-white text-dark pe-5 cab20-input"
          style="height: 42px;" placeholder="Nombre, estado o fecha..." autocomplete="off" />
        <svg xmlns="http://www.w3.org/2000/svg" title="Buscar" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="#468e6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="position-absolute top-50 end-0 translate-middle-y me-3" style="pointer-events: none;">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      </div>
    </div>

    <!-- ACCIONES PRINCIPALES -->
    <div class="d-flex flex-wrap gap-2 ms-auto">
      <button id="btnCreate"
        class="green-background text-white fw-bold py-2 px-4 rounded border-0 d-inline-flex align-items-center justify-content-center gap-2 cab20-btn-active"
        style="height: 42px;">
        <span class="bg-white"
          style="width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; line-height: 0; flex-shrink: 0;">
          <i data-lucide="plus" style="width: 14px; height: 14px; color: #468e6e;"></i>
        </span>
        <span>Crear</span>
      </button>

      <button id="btnDownload"
        class="btn fw-bold py-2 px-4 rounded border-0 d-inline-flex align-items-center justify-content-center gap-2 shadow-sm"
        style="background-color: #0078d4; color: #ffffff; height: 42px;">
        <i data-lucide="download" style="width: 18px; height: 18px;"></i>
        <span>Descargar</span>
      </button>
    </div>
  </section>

  <!-- TABLA DE REGISTROS -->
  <div class="table-responsive bg-white rounded mb-4 cab20-table-wrap">
    <table class="table mb-0 align-middle">
      <thead class="border-bottom cab20-table-head">
        <tr>
          <th scope="col" class="p-3 text-center fw-bold green-text">
            <button type="button" class="cab20-sort-btn" data-sort-key="fechaInicio" data-sort-type="date"
              aria-label="Ordenar por fecha de inicio">
              <span>Fecha inicio de semana</span>
              <span class="cab20-sort-indicator" aria-hidden="true"></span>
            </button>
          </th>
          <th scope="col" class="p-3 text-center fw-bold green-text">
            <button type="button" class="cab20-sort-btn" data-sort-key="fechaFin" data-sort-type="date"
              aria-label="Ordenar por fecha de fin">
              <span>Fecha final de semana</span>
              <span class="cab20-sort-indicator" aria-hidden="true"></span>
            </button>
          </th>
          <th scope="col" class="p-3 text-center fw-bold green-text">
            <button type="button" class="cab20-sort-btn" data-sort-key="estadoAprobacion" data-sort-type="text"
              aria-label="Ordenar por estado">
              <span>Estado aprobación semana</span>
              <span class="cab20-sort-indicator" aria-hidden="true"></span>
            </button>
          </th>
          <th scope="col" class="p-3 text-center fw-bold green-text">
            <button type="button" class="cab20-sort-btn" data-sort-key="contacto" data-sort-type="text"
              aria-label="Ordenar por contacto">
              <span>Contacto</span>
              <span class="cab20-sort-indicator" aria-hidden="true"></span>
            </button>
          </th>
          <th scope="col" class="p-3 text-center fw-bold green-text">
            <button type="button" class="cab20-sort-btn" data-sort-key="totalHoras" data-sort-type="number"
              aria-label="Ordenar por total de horas">
              <span>Total Horas Registradas</span>
              <span class="cab20-sort-indicator" aria-hidden="true"></span>
            </button>
          </th>
          <th scope="col" class="p-3 text-center fw-bold green-text">Acciones</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="cab20Pagination"
    class="d-none bg-white rounded border shadow-sm px-3 py-2 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-2">

    <div id="cab20PaginationInfo" class="small text-secondary">
      Mostrando 0-0 de 0
    </div>

    <div class="d-flex align-items-center gap-2">
      <button id="cab20PrevPage" type="button" class="btn btn-light btn-sm">
        Anterior
      </button>
      <button id="cab20NextPage" type="button" class="btn btn-light btn-sm">
        Siguiente
      </button>
    </div>
  </div>
</main>

<input type="hidden" id="contactId" value="{{ user.contactid }}" />
<input type="hidden" id="userId" value="{{ user.id }}" />
<input type="hidden" id="userName" value="{{ user.fullname }}" />

<!-- MODAL DE CONFIRMACION DE BORRADO -->
<div class="modal fade" id="deleteDialog" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered cab20-confirm-dialog">
    <div class="modal-content bg-white rounded shadow overflow-hidden cab20-modal-card cab20-confirm-card border-0">
      <div class="border-bottom cab20-modal-head cab20-confirm-head">
        <i data-lucide="alert-triangle" class="cab20-confirm-icon" style="color: #d9534f;"></i>
        <h5 class="fw-bold text-dark mb-0">Eliminar cabecera</h5>
      </div>

      <div class="px-4 py-3">
        <p id="deleteRecordInfo" class="small text-dark mb-0 cab20-confirm-text">Esta acción no se puede deshacer.</p>
      </div>

      <div class="px-4 py-3 border-top d-flex justify-content-between align-items-center gap-3 cab20-modal-foot">
        <button id="cancelDeleteBtn" type="button" class="btn btn-light text-secondary" data-bs-dismiss="modal">
          Cancelar
        </button>
        <button id="confirmDeleteBtn"
          class="green-background text-white rounded border-0 px-4 py-2 d-inline-flex align-items-center gap-2 cab20-btn-active">
          <i data-lucide="trash-2" style="width: 18px; height: 18px;"></i>
          <span>Eliminar</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL DE CONFIRMACION DE COPIA -->
<div class="modal fade" id="copyDialog" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered cab20-confirm-dialog">
    <div class="modal-content bg-white rounded shadow overflow-hidden cab20-modal-card cab20-confirm-card border-0">
      <div class="border-bottom cab20-modal-head cab20-confirm-head">
        <i data-lucide="copy" class="cab20-confirm-icon" style="color: #31708f;"></i>
        <h5 class="fw-bold text-dark mb-0">Copiar cabecera</h5>
      </div>

      <div class="px-4 py-3">
        <p class="small text-dark mb-0 cab20-confirm-text">
          ¿Estás seguro que desea copiar esta cabecera?
          <span id="copyRecordInfo" class="text-secondary"></span>
        </p>
      </div>

      <div class="px-4 py-3 border-top d-flex justify-content-between align-items-center gap-3 cab20-modal-foot">
        <button id="cancelCopyBtn" type="button" class="btn btn-light text-secondary" data-copy-dismiss="modal">
          Cancelar
        </button>
        <button id="confirmCopyBtn"
          class="green-background text-white rounded border-0 px-4 py-2 d-inline-flex align-items-center gap-2 cab20-btn-active">
          <i data-lucide="check" style="width: 18px; height: 18px;"></i>
          <span>Aceptar</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ICONOS -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<!-- ENTITY LIST ORIGINAL DEL PORTAL -->
<div class="row sectionBlockLayout text-start"
  style="display: flex; flex-wrap: wrap; margin: 0; min-height: auto; padding: 8px;">
  <div class="container" style="padding: 0; display: flex; flex-wrap: wrap;">
    <div class="col-lg-12 columnBlockLayout"
      style="flex-grow: 1; display: flex; flex-direction: column; min-width: 250px;">
    </div>
  </div>
</div>
