<div class="row sectionBlockLayout text-start" style="display: flex; flex-wrap: wrap; margin: 0px; min-height: auto; padding: 8px;">
  <div class="container" style="padding: 0px; display: flex; flex-wrap: wrap;"><div class="col-lg-12 columnBlockLayout" style="flex-grow: 1; display: flex; flex-direction: column; min-width: 250px;"></div></div>
</div>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Cabecera Imputaciones</title><link rel="stylesheet" href="/bootstrap.min.css" /><link rel="stylesheet" href="/portalbasictheme.css" /><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" /><link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
<main class="container py-4 cab20-page">
  <!-- HEADER / BANNER -->
  <section class="bg-white border-bottom shadow-sm mb-4 cab20-header cab20-page-banner">
    <div class="px-3 py-3">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div>
          <h1 class="fs-4 text-dark mb-1 fw-bold">Cabecera de Imputaciones</h1>
          <p class="small text-dark mb-0">Gestion de registros semanales</p>
        </div>
      </div>
    </div>
  </section>
  <!-- ACTION BAR -->
  <section class="bg-white p-4 rounded shadow-sm border d-flex flex-wrap gap-3 align-items-end mb-4 cab20-card">
    <!-- BUSCADOR -->
    <div class="flex-grow-1 position-relative" style="min-width: 280px;">
      <label class="d-block small fw-bold green-text text-uppercase mb-2">Buscar registros</label>
      <div class="position-relative">
        <input type="text" id="searchInput" placeholder="Nombre, estado o fecha..." autocomplete="off" class="form-control bg-white text-dark pe-5 cab20-input" style="height: 42px;" /><svg xmlns="http://www.w3.org/2000/svg" title="Buscar" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#468e6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="position-absolute top-50 end-0 translate-middle-y me-3" style="pointer-events: none;">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      </div>
    </div>
    <!-- ACCIONES PRINCIPALES -->
    <div class="d-flex flex-wrap gap-2 ms-auto">
      <button id="btnCreate" class="green-background text-white fw-bold py-2 px-4 rounded border-0 d-inline-flex align-items-center justify-content-center gap-2 cab20-btn-active" style="height: 42px;">
        <span class="bg-white" style="width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; line-height: 0; flex-shrink: 0;"><i data-lucide="plus" style="width: 14px; height: 14px; color: #468e6e;"></i></span><span>Crear</span></button
      ><button id="btnDownload" class="btn fw-bold py-2 px-4 rounded border-0 d-inline-flex align-items-center justify-content-center gap-2 shadow-sm" style="background-color: #0078d4; color: #ffffff; height: 42px;"><i data-lucide="download" style="width: 18px; height: 18px;"></i><span>Descargar</span></button>
    </div>
  </section>
  <!-- TABLA DE REGISTROS -->
  <div class="table-responsive bg-white rounded mb-4 cab20-table-wrap">
    <table class="table mb-0 align-middle">
      <thead class="border-bottom cab20-table-head">
        <tr>
          <th scope="col" class="p-3 text-center fw-bold green-text">
            <button type="button" data-sort-key="fechaInicio" data-sort-type="date" aria-label="Ordenar por fecha de inicio" class="cab20-sort-btn"><span>Fecha inicio de semana</span><span aria-hidden="true" class="cab20-sort-indicator"></span></button>
          </th>
          <th scope="col" class="p-3 text-center fw-bold green-text">
            <button type="button" data-sort-key="fechaFin" data-sort-type="date" aria-label="Ordenar por fecha de fin" class="cab20-sort-btn"><span>Fecha final de semana</span><span aria-hidden="true" class="cab20-sort-indicator"></span></button>
          </th>
          <th scope="col" class="p-3 text-center fw-bold green-text">
            <button type="button" data-sort-key="estadoAprobacion" data-sort-type="text" aria-label="Ordenar por estado" class="cab20-sort-btn"><span>Estado aprobación semana</span><span aria-hidden="true" class="cab20-sort-indicator"></span></button>
          </th>
          <th scope="col" class="p-3 text-center fw-bold green-text">
            <button type="button" data-sort-key="contacto" data-sort-type="text" aria-label="Ordenar por contacto" class="cab20-sort-btn"><span>Contacto</span><span aria-hidden="true" class="cab20-sort-indicator"></span></button>
          </th>
          <th scope="col" class="p-3 text-center fw-bold green-text">
            <button type="button" data-sort-key="totalHoras" data-sort-type="number" aria-label="Ordenar por total de horas" class="cab20-sort-btn"><span>Total Horas Registradas</span><span aria-hidden="true" class="cab20-sort-indicator"></span></button>
          </th>
          <th scope="col" class="p-3 text-center fw-bold green-text">Acciones</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="row">
          <td class="cell"></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<input type="hidden" id="contactId" value="contactid" /><input type="hidden" id="userId" value="id" /><input type="hidden" id="userName" value="John Doe" /><!-- MODAL DE CONFIRMACION DE BORRADO -->
<div id="deleteDialog" aria-hidden="true" class="modal fade">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content bg-white rounded shadow w-100 overflow-hidden cab20-modal-card border-0">
      <div class="px-4 py-3 border-bottom cab20-modal-head text-center">
        <i data-lucide="alert-triangle" class="mb-2 mt-2" style="width: 48px; height: 48px; color: #d9534f;"></i>
        <h5 class="fw-bold text-dark mb-0">Eliminar registro</h5>
      </div>
      <div class="p-4 text-center"><p id="deleteRecordInfo" class="small text-dark mb-0">Esta acción no se puede deshacer.</p></div>
      <div class="px-4 py-3 border-top d-flex justify-content-between align-items-center gap-3 cab20-modal-foot">
        <button type="button" data-bs-dismiss="modal" class="btn btn-light text-secondary">Cancelar</button><button id="confirmDeleteBtn" class="green-background text-white rounded border-0 px-4 py-2 d-inline-flex align-items-center gap-2 cab20-btn-active"><i data-lucide="trash-2" style="width: 18px; height: 18px;"></i><span>Eliminar</span></button>
      </div>
    </div>
  </div>
</div>
<!-- ICONOS -->
<script src="https://unpkg.com/lucide@latest"></script>
